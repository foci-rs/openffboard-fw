[package]
name = "openffboard-fw"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/foci-rs/openffboard-fw"

[dependencies]
# RTIC
rtic = { version = "2.2", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.1", features = ["stm32_tim2", "stm32f407vg"] }
rtic-sync = "1.4"

# Embassy HAL (SPI DMA, USB, GPIO — not the executor)
embassy-stm32 = { version = "0.6", features = [
    "defmt",
    "stm32f407vg",
    "unstable-pac",
    "rt",
    "time-driver-tim4",
] }
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-sync = "0.6"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }

# Cortex-M
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
critical-section = "1.2"

# Klipper protocol (ankyra)
ankyra = { git = "https://github.com/foci-rs/ankyra" }
ankyra-macros = { git = "https://github.com/foci-rs/ankyra" }
ankyra-assemble = { git = "https://github.com/foci-rs/ankyra" }

# FOCI crates
foci-firmware = { git = "https://github.com/foci-rs/foci-firmware" }
foci-firmware-macros = { path = "../../shared/foci-firmware/macros" }
foci-klipper = { git = "https://github.com/foci-rs/foci-klipper" }
foci-tmc4671 = { git = "https://github.com/foci-rs/foci-tmc4671" }
foci-usb-stm32 = { git = "https://github.com/foci-rs/foci-usb-stm32" }

# Logging
defmt = "1.0"
defmt-rtt = "1.1"

# no_std utilities
heapless = { version = "0.9", features = ["defmt"] }

[features]
dev = ["foci-firmware/dev"]
dev-flash = []
usb-p1-probe = []
trace = ["foci-firmware/trace", "foci-usb-stm32/trace"]
trace-current-path = ["trace"]
