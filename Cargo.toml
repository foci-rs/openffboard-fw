[package]
name = "openffboard-fw"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# RTIC framework
rtic = { version = "2.2", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.1", features = ["stm32_tim2", "stm32f407vg"] }
rtic-sync = "1.4"

# Embassy HAL (SPI DMA, USB, GPIO — not the executor)
embassy-stm32 = { version = "0.6", features = [
    "defmt",
    "stm32f407vg",
    "unstable-pac",
    "rt",
    "time-driver-tim4",
] }
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-sync = "0.6"
embedded-hal-async = { workspace = true }
embedded-hal-bus = { version = "0.3", features = ["async"] }

# Cortex-M
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
critical-section = "1.2"

# Klipper protocol
anchor.workspace = true

# Project crates
foci-tmc4671 = { path = "../../shared/foci-tmc4671" }
foci-klipper = { path = "../../shared/foci-klipper" }
foci-usb-stm32 = { path = "../../shared/foci-usb-stm32" }
foci-firmware = { path = "../../shared/foci-firmware" }

# Logging
defmt.workspace = true
defmt-rtt = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }

# no_std utilities
heapless.workspace = true

[features]
dev = ["foci-firmware/dev"]

[build-dependencies]
anchor_codegen.workspace = true
