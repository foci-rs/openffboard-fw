name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The orchestrator sets the release profile; this crate builds alone in CI.
  CARGO_PROFILE_RELEASE_OPT_LEVEL: s
  CARGO_PROFILE_RELEASE_LTO: "true"

jobs:
  check:
    name: Rust stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: thumbv7em-none-eabi
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy (embedded)
        run: cargo clippy --target thumbv7em-none-eabi -- -D warnings
      - name: cargo build (embedded, release)
        run: cargo build --target thumbv7em-none-eabi --release
